<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 890" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1080" height="890" rx="12" fill="#ffffff"/>

  <text x="600" y="196" text-anchor="middle" font-size="16" fill="#656d76">板上只有 1 个 3V3 针 → 在红点处分成两路（用一分二线）</text>

  <!-- 麦克风：圆形板 -->
  <circle cx="150" cy="475" r="120" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="140" cy="450" r="28" fill="#e7ebef" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="132" cy="442" r="3" fill="#9ca3af"/>
  <circle cx="148" cy="442" r="3" fill="#9ca3af"/>
  <circle cx="132" cy="458" r="3" fill="#9ca3af"/>
  <circle cx="148" cy="458" r="3" fill="#9ca3af"/>
  <text x="150" y="322" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">INMP441 麦克风</text>
  <text x="150" y="345" text-anchor="middle" font-size="14" fill="#656d76">圆形板，6 个焊盘</text>

  <!-- 麦克风排针条 -->
  <rect x="246" y="332" width="100" height="290" rx="10" fill="#eaeef2" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="296" y="358" text-anchor="middle" font-size="16" fill="#1f2328">VDD</text>
  <text x="296" y="408" text-anchor="middle" font-size="16" fill="#1f2328">GND</text>
  <text x="296" y="458" text-anchor="middle" font-size="16" fill="#1f2328">SCK</text>
  <text x="296" y="508" text-anchor="middle" font-size="16" fill="#1f2328">WS</text>
  <text x="296" y="558" text-anchor="middle" font-size="15" fill="#1f2328">SD/DOUT</text>
  <text x="296" y="608" text-anchor="middle" font-size="16" fill="#1f2328">L/R</text>

  <!-- ESP32 -->
  <rect x="470" y="250" width="290" height="580" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="615" y="296" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2328">ESP32-S3 N16R8</text>
  <text x="615" y="322" text-anchor="middle" font-size="14" fill="#656d76">位置只是示意，按丝印文字找</text>

  <!-- microSD 模块 -->
  <rect x="860" y="330" width="180" height="330" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="950" y="312" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">microSD 模块</text>

  <!-- 线（先画光晕再画彩线） -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M346 352 H470" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M346 352 H470" stroke="#e5484d" stroke-width="8"/>
    <path d="M346 402 H470" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M346 402 H470" stroke="#1f2937" stroke-width="8"/>
    <path d="M346 452 H470" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M346 452 H470" stroke="#facc15" stroke-width="8"/>
    <path d="M346 502 H470" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M346 502 H470" stroke="#22c55e" stroke-width="8"/>
    <path d="M346 552 H470" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M346 552 H470" stroke="#fb923c" stroke-width="8"/>
    <path d="M346 602 H470" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M346 602 H470" stroke="#1f2937" stroke-width="8"/>
    <path d="M800 352 H860 M800 210 V352 M400 210 H800" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M800 352 H860 M800 210 V352 M400 210 H800" stroke="#e5484d" stroke-width="8"/>
    <path d="M860 402 H760" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M860 402 H760" stroke="#a855f7" stroke-width="8"/>
    <path d="M860 452 H760" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M860 452 H760" stroke="#14b8a6" stroke-width="8"/>
    <path d="M860 502 H760" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M860 502 H760" stroke="#3b82f6" stroke-width="8"/>
    <path d="M860 552 H760" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M860 552 H760" stroke="#ec4899" stroke-width="8"/>
    <path d="M860 602 H760" stroke="rgba(0,0,0,.12)" stroke-width="13"/><path d="M860 602 H760" stroke="#1f2937" stroke-width="8"/>
  </g>

  <!-- 5V 不接 -->
  <path d="M470 690 H446" stroke="#d0d7de" stroke-width="6" stroke-linecap="round"/>
  <text x="428" y="696" text-anchor="middle" font-size="19" fill="#656d76">×</text>

  <!-- 引脚圆点 -->
  <g stroke="rgba(0,0,0,.22)" stroke-width="1.5">
    <circle cx="346" cy="352" r="6" fill="#e5484d"/><circle cx="346" cy="402" r="6" fill="#1f2937"/>
    <circle cx="346" cy="452" r="6" fill="#facc15"/><circle cx="346" cy="502" r="6" fill="#22c55e"/>
    <circle cx="346" cy="552" r="6" fill="#fb923c"/><circle cx="346" cy="602" r="6" fill="#1f2937"/>
    <circle cx="470" cy="352" r="6" fill="#e5484d"/><circle cx="470" cy="402" r="6" fill="#1f2937"/>
    <circle cx="470" cy="452" r="6" fill="#facc15"/><circle cx="470" cy="502" r="6" fill="#22c55e"/>
    <circle cx="470" cy="552" r="6" fill="#fb923c"/><circle cx="470" cy="602" r="6" fill="#1f2937"/>
    <circle cx="470" cy="690" r="6" fill="#d0d7de"/>
    <circle cx="760" cy="402" r="6" fill="#a855f7"/><circle cx="760" cy="452" r="6" fill="#14b8a6"/>
    <circle cx="760" cy="502" r="6" fill="#3b82f6"/><circle cx="760" cy="552" r="6" fill="#ec4899"/>
    <circle cx="760" cy="602" r="6" fill="#1f2937"/>
    <circle cx="860" cy="352" r="6" fill="#e5484d"/><circle cx="860" cy="402" r="6" fill="#a855f7"/>
    <circle cx="860" cy="452" r="6" fill="#14b8a6"/><circle cx="860" cy="502" r="6" fill="#3b82f6"/>
    <circle cx="860" cy="552" r="6" fill="#ec4899"/><circle cx="860" cy="602" r="6" fill="#1f2937"/>
  </g>

  <!-- 分线点 -->
  <circle cx="400" cy="352" r="9" fill="#e5484d" stroke="#ffffff" stroke-width="2.5"/>

  <!-- 板子引脚文字 -->
  <text x="486" y="359" font-size="18" fill="#1f2328">3V3</text>
  <text x="486" y="409" font-size="18" fill="#1f2328">GND</text>
  <text x="486" y="459" font-size="18" fill="#1f2328">GPIO4</text>
  <text x="486" y="509" font-size="18" fill="#1f2328">GPIO5</text>
  <text x="486" y="559" font-size="18" fill="#1f2328">GPIO6</text>
  <text x="486" y="609" font-size="18" fill="#1f2328">GND</text>
  <text x="486" y="697" font-size="15" fill="#656d76">5V 不接</text>

  <text x="744" y="409" text-anchor="end" font-size="18" fill="#1f2328">GPIO10</text>
  <text x="744" y="459" text-anchor="end" font-size="18" fill="#1f2328">GPIO11</text>
  <text x="744" y="509" text-anchor="end" font-size="18" fill="#1f2328">GPIO12</text>
  <text x="744" y="559" text-anchor="end" font-size="18" fill="#1f2328">GPIO13</text>
  <text x="744" y="609" text-anchor="end" font-size="18" fill="#1f2328">GND</text>

  <text x="615" y="790" text-anchor="middle" font-size="14" fill="#656d76">GPIO19 / GPIO20 是 USB 专用，不要接</text>

  <!-- 读卡模块引脚文字 -->
  <text x="874" y="359" font-size="18" fill="#1f2328">3V3</text>
  <text x="874" y="409" font-size="18" fill="#1f2328">CS</text>
  <text x="874" y="459" font-size="18" fill="#1f2328">MOSI</text>
  <text x="874" y="509" font-size="18" fill="#1f2328">CLK</text>
  <text x="874" y="559" font-size="18" fill="#1f2328">MISO</text>
  <text x="874" y="609" font-size="18" fill="#1f2328">GND</text>

  <!-- 图例 -->
  <g font-size="14" fill="#1f2328">
    <rect x="30" y="852" width="22" height="7" rx="3" fill="#e5484d"/><text x="58" y="862">红 3V3</text>
    <rect x="130" y="852" width="22" height="7" rx="3" fill="#1f2937"/><text x="158" y="862">黑 GND</text>
    <rect x="240" y="852" width="22" height="7" rx="3" fill="#facc15"/><text x="268" y="862">黄 麦克风SCK→GPIO4</text>
    <rect x="440" y="852" width="22" height="7" rx="3" fill="#22c55e"/><text x="468" y="862">绿 麦克风WS→GPIO5</text>
    <rect x="645" y="852" width="22" height="7" rx="3" fill="#fb923c"/><text x="673" y="862">橙 麦克风SD→GPIO6</text>
    <rect x="865" y="852" width="22" height="7" rx="3" fill="#a855f7"/><text x="893" y="862">紫 读卡CS→GPIO10</text>
    <rect x="30" y="882" width="22" height="7" rx="3" fill="#14b8a6"/><text x="58" y="892">青 读卡MOSI→GPIO11</text>
    <rect x="240" y="882" width="22" height="7" rx="3" fill="#3b82f6"/><text x="268" y="892">蓝 读卡CLK→GPIO12</text>
    <rect x="440" y="882" width="22" height="7" rx="3" fill="#ec4899"/><text x="468" y="892">粉 读卡MISO→GPIO13</text>
  </g>
</svg>
